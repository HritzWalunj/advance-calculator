name: Pytest CI

on: [push, pull_request]

jobs:
  pipeline:
    uses: HritzWalunj/common-ci-infra/.github/workflows/common-ci-pipeline.yml@v1
    with:
      project_type: "advance"
      main_module: "calculator"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout advance-calculator
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Run pytest
        run: pytest -v
